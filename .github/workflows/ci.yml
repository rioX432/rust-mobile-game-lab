name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libudev-dev
      - run: scripts/cargo.sh fmt --all -- --check
      - run: scripts/cargo.sh clippy --workspace --all-targets --locked -- -D warnings
      - run: scripts/cargo.sh test --workspace --locked
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: rustup toolchain install 1.99.0 --profile minimal --target aarch64-linux-android
      - run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;28.2.13676358" "platforms;android-35" "build-tools;35.0.0"
      - run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" scripts/android-build.sh
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.0 --profile minimal --target aarch64-apple-ios-sim
      - run: brew list xcodegen || brew install xcodegen
      - run: IOS_SDK_VERSION="$(xcrun --sdk iphonesimulator --show-sdk-version)" scripts/ios-build.sh
