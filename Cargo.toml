[workspace]
members = ["crates/core", "crates/renderer", "crates/runtime", "apps/desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
game-core = { path = "crates/core" }
game-renderer = { path = "crates/renderer" }
wgpu = "=30.0.1"
winit = "=0.30.13"
bytemuck = { version = "1.24", features = ["derive"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jni = "=0.21.1"

[profile.release]
opt-level = 3
lto = "thin"
panic = "unwind"
