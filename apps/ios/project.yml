name: RustMobileLab
options:
  minimumXcodeGenVersion: "2.45.0"
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    ARCHS: arm64
    CODE_SIGNING_ALLOWED: NO
    SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Sources/GameRuntime-Bridging-Header.h"
    HEADER_SEARCH_PATHS: "$(SRCROOT)/../../include"
    LIBRARY_SEARCH_PATHS: "$(SRCROOT)/build/rust/$(PLATFORM_NAME)"
    OTHER_LDFLAGS: "$(inherited) -lgame_runtime -lc++ -liconv -framework Metal -framework QuartzCore -framework Security -framework SystemConfiguration"
targets:
  RustMobileLab:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lab.rustmobile.ios
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
schemes:
  RustMobileLab:
    build:
      targets:
        RustMobileLab: all
